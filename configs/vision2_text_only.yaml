# Cierre de fase 4 (decisión 0008): igual que vision_text_only.yaml con data/vision_pilot_v2 (estilos por partición).

# Fase 4, control C: igual que vision_heads pero sin la imagen. El texto de las filas es idéntico,
# así que la diferencia V − C mide lo que aporta la imagen. Mismos hiperparámetros y selección.
kind: decision_heads
name: vision2_text_only
base_config: configs/e2b_vision.yaml
dataset: data/vision_pilot_v2
split_seed: 0
primitives: [noul, choice, score]
images: omit  # control C: mismas filas sin imagen (decisión 0007)
extraction:
  microbatch_rows: 1  # decisiones 0002 y 0007
cache_dir: artifacts/cache/representations
runs_dir: runs
train:
  epochs: 30
  lr: 0.001
  weight_decay: 0.01
  questions_per_step: 8
  logit_chunk_rows: 4
  seed: 0
  threshold: 0.5
  rps_lambda: 0.0
  type_weights: {noul: 1.0, choice: 1.0, score: 1.0}
  select_on: validation
  feature_norm: standardize_train
