[project]
name = "gemma-system-one"
version = "0.0.1"
description = "Evaluador local Noul/Choice/Score sobre Gemma 4 con cabezales aprendidos (PyTorch/MPS)"
readme = "README.md"
requires-python = ">=3.11,<3.12"
license = { text = "Proprietary" }
dependencies = [
    "torch>=2.14",
    "transformers>=5.17",
    "huggingface_hub>=1.32",
    "safetensors>=0.8",
    "numpy>=2.0",
    "pydantic>=2.13",
    "PyYAML>=6.0",
    "psutil>=7.0",
    "pillow>=11",
    "torchvision>=0.29",
    "peft>=0.21",
    "fastapi>=0.120",
    "uvicorn>=0.38",
    "httpx>=0.28",
]

[project.scripts]
gso = "gemma_system_one.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.12"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gemma_system_one"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "mps: requiere backend MPS real (Apple Silicon)",
    "weights: requiere los pesos reales del checkpoint en la caché local",
]

[tool.ruff]
line-length = 110
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

# Generadores con muchos literales de texto: hasta daa27ce estaban fuera de Git y de ruff por un
# «data/» sin anclar en .gitignore. Se versionan tal cual; no se reformatean para no tocar el código
# que produce los datasets con hash registrado.
[tool.ruff.lint.per-file-ignores]
"src/gemma_system_one/data/generate.py" = ["E501"]
"src/gemma_system_one/data/generate_mixed.py" = ["E501"]
"src/gemma_system_one/data/generate_vision.py" = ["E501"]

[tool.ruff.format]
exclude = [
    "src/gemma_system_one/data/generate.py",
    "src/gemma_system_one/data/generate_mixed.py",
    "src/gemma_system_one/data/generate_vision.py",
]
